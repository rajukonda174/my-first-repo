- name: variable demo from ini
  hosts: all
  tasks:
    - name: print Inventory variable host
      debug:
        msg: "from_ini_host - {{ from_ini_host }}"

    - name: print Inventory  group
      debug:
        msg: "from_ini_group - {{ from_ini_group }}"

- name: variable demo from play
  hosts: all
  vars:
    from_play: 300
  vars_files:
    - demo_vars.yml
  tasks:
    - name: print variable - play level
      debug:
        msg: "from_play - {{ from_play }}"
    - name: print variable - play file
      debug:
        msg: "from_file - {{ from_file }}"

- name: variable demo from role
  hosts: all
  roles:
    - sample

- name: variable demo from play
  hosts: all
  tasks:
    - name: print from task level
      debug:
        msg: "from_task - {{ from_task }}"
      vars:
        from_task: 700
    - name: print from commandline
      debug:
        msg: "from_cli - {{ from_cli }}"
