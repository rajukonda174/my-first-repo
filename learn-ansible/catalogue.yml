- name: setup mysql database
  hosts: all
  become: yes
  tasks:
    - name: Create appuser
      ansible.builtin.user:
        name: appuser
        system: yes
        shell: /bin/false
        create_home: no

    - name: copy catalogue service
      ansible.builtin.copy:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service

    - name: install Golang Git Mysql
      ansible.builtin.dnf:
        name:
          - golang
          - git
          - mysql8.4
        state: present

    - name: remove /apps
      ansible.builtin.file:
        path: /app
        state: absent

    - name: create /apps folder
      ansible.builtin.file:
        path: /app
        state: directory

    - name: download catalogue content
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/catalogue.zip
        dest: /app
        remote_src: yes

    - name: Creating schema user and master data
      ansible.builtin.shell: |
        mysql -h mysql-dev.rdevopsb89.online -u root -pRoboShop@1 < db/schema.sql
        
        mysql -h mysql-dev.rdevopsb89.online -u root -pRoboShop@1 < db/app-user.sql
        
        mysql -h mysql-dev.rdevopsb89.online -u root -pRoboShop@1 catalogue < db/master-data.sql
      args:
          chdir: /app

    - name: compiling code
      ansible.builtin.shell: |
          go mod tidy
          CGO_ENABLED=0 go build -o /app/catalogue .
      args:
            chdir: /app

    - name: Apply permission for application folder
      ansible.builtin.file:
        path: /app
        owner: appuser
        group: appuser
        recurse: yes
        mode: 'o-rwx'

    - name: catalogue start
      ansible.builtin.systemd_service:
        name: catalogue
        state: started
        enabled: yes
        daemon_reload: yes

